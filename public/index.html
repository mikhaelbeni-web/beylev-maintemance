/* Liste de toutes les adresses connues : liste fixe + adresses libres saisies dans les missions */
function useAllAddresses() {
  const { missions } = useData();
  return useMemo(() => {
    const seen = new Set(); const out = [];
    const add = a => { const t = String(a || "").trim(); const k = norm(t); if (t && t !== "CUSTOM" && !seen.has(k)) { seen.add(k); out.push(t); } };
    BUILDINGS_LIST.forEach(add);
    missions.map(m => m.location).sort().forEach(add);
    return out;
  }, [missions]);
}

function MultiSelect({ label, allLabel, options, value, onChange }) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState("");
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    const h = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", h); document.addEventListener("touchstart", h);
    return () => { document.removeEventListener("mousedown", h); document.removeEventListener("touchstart", h); };
  }, [open]);
  const shown = options.filter(o => !q || norm(o.label).includes(norm(q)));
  const toggle = id => onChange(value.includes(id) ? value.filter(x => x !== id) : [...value, id]);
  const text = !value.length ? allLabel : value.length === 1 ? (options.find(o => o.id === value[0]) || {}).label || "1 choix" : `${value.length} ${label}`;
  return (
    <div ref={ref} style={{ position: "relative" }}>
      <button type="button" className="m-input" style={{ textAlign: "left", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", fontSize: 15, borderColor: value.length ? "var(--primary)" : undefined }} onClick={() => setOpen(o => !o)}>{text}</button>
      {open && (
        <div className="m-card fade-in" style={{ position: "absolute", zIndex: 50, top: "calc(100% + 4px)", left: 0, right: 0, minWidth: 260, maxHeight: 340, display: "flex", flexDirection: "column", boxShadow: "0 8px 24px rgba(0,0,0,.15)" }}>
          <div style={{ padding: 8, borderBottom: "1px solid var(--border-soft)" }}>
            <input className="m-input" autoFocus placeholder="Rechercher" value={q} onChange={e => setQ(e.target.value)} />
            <div className="flex gap-3" style={{ marginTop: 6, fontSize: 13 }}>
              <button type="button" style={{ border: 0, background: "none", color: "#0073ea", padding: 0 }} onClick={() => onChange([...new Set([...value, ...shown.map(o => o.id)])])}>Tout cocher</button>
              <button type="button" style={{ border: 0, background: "none", color: "#0073ea", padding: 0 }} onClick={() => onChange([])}>Effacer</button>
            </div>
          </div>
          <div style={{ overflowY: "auto" }}>
            {shown.map(o => (
              <label key={o.id} className="flex items-center gap-2" style={{ padding: "7px 10px", fontSize: 14, cursor: "pointer", borderBottom: "1px solid var(--border-soft)" }}>
                <input type="checkbox" checked={value.includes(o.id)} onChange={() => toggle(o.id)} />
                <span style={{ flex: 1, minWidth: 0 }}>{o.label}</span>
                {o.hint && <span style={{ fontSize: 11, color: "var(--muted)" }}>{o.hint}</span>}
              </label>
            ))}
            {!shown.length && <div style={{ padding: 12, fontSize: 13, color: "var(--muted)" }}>Aucun résultat</div>}
          </div>
        </div>
      )}
    </div>
  );
}

const PERIODS = [
  { id: "month", label: "Ce mois" },
  { id: "prev", label: "Mois dernier" },
  { id: "quarter", label: "3 derniers mois" },
  { id: "year", label: "Cette année" }
];
function periodRange(id) {
  const now = new Date(); const y = now.getFullYear(); const m = now.getMonth();
  const last = (yy, mm) => ymd(new Date(yy, mm + 1, 0));
  if (id === "month") return [ymd(new Date(y, m, 1)), last(y, m)];
  if (id === "prev") return [ymd(new Date(y, m - 1, 1)), last(y, m - 1)];
  if (id === "quarter") return [ymd(new Date(y, m - 2, 1)), last(y, m)];
  if (id === "year") return [`${y}-01-01`, `${y}-12-31`];
  return ["", ""];
}
const fmtMinutes = n => (!n ? "—" : n < 60 ? `${n} min` : `${Math.floor(n / 60)} h${n % 60 ? pad(n % 60) : ""}`);

function HistoryScreen({ me, visible, onOpen }) {
  const { fetchMonths, companies, companyOf, users } = useData();
  const addresses = useAllAddresses();
  const [q, setQ] = useState("");
  const [status, setStatus] = useState("");
  const [from, setFrom] = useState("");
  const [to, setTo] = useState("");
  const [selCompanies, setSelCompanies] = useState([]);
  const [selAddresses, setSelAddresses] = useState([]);
  const [groupBy, setGroupBy] = useState("month");
  const canBill = me.role !== "tech";

  const defaultMonths = useMemo(() => { const now = new Date(); const out = []; for (let i = 6; i >= -12; i--) { const d = new Date(now.getFullYear(), now.getMonth() + i, 1); out.push(monthKeyYM(d.getFullYear(), d.getMonth())); } return out; }, []);
  useEffect(() => { fetchMonths(defaultMonths); }, [fetchMonths, defaultMonths]);
  // Une periode hors de la fenetre par defaut charge les mois correspondants
  useEffect(() => { if (from || to) fetchMonths(monthKeysBetween(from || to, to || from)); }, [from, to, fetchMonths]);

  const companyIdOf = m => { const c = companyOf(m.location); return c ? c.id : NO_COMPANY; };
  // Les adresses proposees se limitent aux societes cochees
  const addressOptions = addresses
    .filter(a => !selCompanies.length || selCompanies.includes((companyOf(a) || { id: NO_COMPANY }).id))
    .map(a => ({ id: a, label: a, hint: (companyOf(a) || {}).name }));
  const companyOptions = [...companies.map(c => ({ id: c.id, label: c.name, hint: `${(c.addresses || []).length} adr.` })).sort((a, b) => a.label.localeCompare(b.label)), { id: NO_COMPANY, label: "Sans société" }];

  const filtered = visible.filter(m => {
    if (selCompanies.length && !selCompanies.includes(companyIdOf(m))) return false;
    if (selAddresses.length && !selAddresses.some(a => norm(a) === norm(m.location))) return false;
    if (status === "pending") { if (m.approved !== false) return false; }
    else if (status === "rejected") { if (m.approved !== "rejected") return false; }
    else if (status && (!isApproved(m) || (m.status || "todo") !== status)) return false;
    if (from && endOf(m) < from) return false;
    if (to && m.date > to) return false;
    if (q) { const s = norm(q); if (!norm([m.title, m.description, m.location, (companyOf(m.location) || {}).name, ...(m.comments || []).map(c => c.text)].join(" ")).includes(s)) return false; }
    return true;
  }).sort((a, b) => b.date.localeCompare(a.date));

  const groups = []; const map = {};
  filtered.forEach(m => {
    let k, title;
    if (groupBy === "company") { const c = companyOf(m.location); k = c ? c.id : NO_COMPANY; title = c ? c.name : "Sans société"; }
    else if (groupBy === "address") { k = norm(m.location) || "_"; title = m.location || "Sans adresse"; }
    else { k = monthKeyOf(m.date); title = monthLabelOfKey(k).replace(/^./, c => c.toUpperCase()); }
    if (!map[k]) { map[k] = { key: k, title, items: [] }; groups.push(map[k]); }
    map[k].items.push(m);
  });
  if (groupBy !== "month") groups.sort((a, b) => (a.key === NO_COMPANY) - (b.key === NO_COMPANY) || a.title.localeCompare(b.title));

  // Recap par societe : interventions validees hors annulees et refusees
  const billable = filtered.filter(m => isApproved(m) && m.status !== "cancelled");
  const recap = Object.values(billable.reduce((acc, m) => {
    const c = companyOf(m.location); const k = c ? c.id : NO_COMPANY;
    const r = acc[k] || (acc[k] = { key: k, name: c ? c.name : "Sans société", n: 0, done: 0, minutes: 0, addresses: new Set() });
    r.n++; if (m.status === "done") r.done++; r.minutes += Number(m.duration) || 0; r.addresses.add(norm(m.location));
    return acc;
  }, {})).sort((a, b) => (a.key === NO_COMPANY) - (b.key === NO_COMPANY) || b.n - a.n);

  const activePeriod = PERIODS.find(p => { const [f, t] = periodRange(p.id); return f === from && t === to; });
  const hasFilters = !!(q || status || from || to || selCompanies.length || selAddresses.length);
  const reset = () => { setQ(""); setStatus(""); setFrom(""); setTo(""); setSelCompanies([]); setSelAddresses([]); };

  function exportCsv() {
    const userName = id => (users.find(u => u.id === id) || {}).name || "";
    const rows = [["Date début", "Date fin", "Heure", "Société", "Adresse", "Intervention", "Description", "Statut", "Technicien", "Durée (min)", "Priorité", "Hostaway"]];
    [...filtered].sort((a, b) => a.date.localeCompare(b.date)).forEach(m => rows.push([
      m.date, endOf(m), m.time || "", (companyOf(m.location) || {}).name || "", m.location || "", m.title || "", (m.description || "").replace(/\s+/g, " ").trim(),
      statusText(m), userName(m.assignedTo), Number(m.duration) || "", (PRIORITY_BY_ID[m.priority] || PRIORITY_BY_ID.normal).label.replace(/\s*⚠️/, ""), m.hostawayId ? "oui" : ""
    ]));
    const sel = companies.filter(c => selCompanies.includes(c.id)).map(c => norm(c.name).replace(/ /g, "-"));
    const name = ["interventions", sel.length === 1 ? sel[0] : "", from || "debut", to || todayStr()].filter(Boolean).join("_");
    downloadCsv(`${name}.csv`, rows);
  }

  return (
    <div>
      <PageHeader title="Historique" subtitle={`${filtered.length} intervention${filtered.length > 1 ? "s" : ""}`}
        actions={canBill && <button className="m-btn" disabled={!filtered.length} onClick={exportCsv}>Exporter CSV</button>} />
      <div className="p-4 md:p-8">
        <div className="flex flex-wrap gap-2 items-center" style={{ marginBottom: 10 }}>
          {PERIODS.map(p => <button key={p.id} className={activePeriod && activePeriod.id === p.id ? "m-btn" : "m-btn-sec"} style={{ padding: "5px 12px" }} onClick={() => { const [f, t] = periodRange(p.id); setFrom(f); setTo(t); }}>{p.label}</button>)}
          <div className="flex items-center gap-1" style={{ fontSize: 13, color: "var(--muted)" }}>
            du <input type="date" className="m-input" style={{ width: 150, padding: "5px 8px" }} value={from} max={to || undefined} onChange={e => setFrom(e.target.value)} />
            au <input type="date" className="m-input" style={{ width: 150, padding: "5px 8px" }} value={to} min={from || undefined} onChange={e => setTo(e.target.value)} />
          </div>
          {hasFilters && <button style={{ border: 0, background: "none", color: "#0073ea", fontSize: 14 }} onClick={reset}>Effacer les filtres</button>}
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2" style={{ marginBottom: 16 }}>
          <MultiSelect label="sociétés" allLabel="Toutes les sociétés" options={companyOptions} value={selCompanies} onChange={v => { setSelCompanies(v); setSelAddresses([]); }} />
          <MultiSelect label="adresses" allLabel="Toutes les adresses" options={addressOptions} value={selAddresses} onChange={setSelAddresses} />
          <select className="m-input" value={status} onChange={e => setStatus(e.target.value)}>
            <option value="">Tous les statuts</option>
            {STATUSES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
            {me.role !== "tech" && <option value="pending">En validation</option>}
            {me.role !== "tech" && <option value="rejected">Refusées</option>}
          </select>
          <div style={{ position: "relative" }}>
            <span style={{ position: "absolute", left: 10, top: 10, color: "var(--muted)" }}><Icon name="search" size={18} /></span>
            <input className="m-input" style={{ paddingLeft: 34 }} placeholder="Rechercher" value={q} onChange={e => setQ(e.target.value)} />
          </div>
        </div>

        {canBill && recap.length > 0 && (
          <div className="m-card" style={{ marginBottom: 20, overflow: "hidden" }}>
            <div style={{ padding: "10px 14px", borderBottom: "1px solid var(--border-soft)", fontWeight: 600 }}>
              Récap facturation <span style={{ fontWeight: 400, color: "var(--muted)", fontSize: 13 }}>· {from || to ? `${from ? fmtDate(from) : "début"} → ${to ? fmtDate(to) : "aujourd’hui"}` : "toute la période chargée"} · hors annulées, refusées et en validation</span>
            </div>
            <div className="m-scroll">
              <table className="m-table" style={{ minWidth: 520 }}>
                <thead><tr><th>Société</th><th>Interventions</th><th>Terminées</th><th>Adresses</th><th>Durée totale</th></tr></thead>
                <tbody>
                  {recap.map(r => (
                    <tr key={r.key} style={{ cursor: "pointer" }} onClick={() => { setSelCompanies([r.key]); setSelAddresses([]); setGroupBy("address"); }}>
                      <td className="m-name" style={{ fontWeight: 500, color: r.key === NO_COMPANY ? "var(--muted)" : "inherit" }}>{r.name}</td>
                      <td>{r.n}</td><td>{r.done}</td><td>{r.addresses.size}</td><td>{fmtMinutes(r.minutes)}</td>
                    </tr>
                  ))}
                  {recap.length > 1 && <tr><td className="m-name" style={{ fontWeight: 700 }}>Total</td><td style={{ fontWeight: 700 }}>{billable.length}</td><td style={{ fontWeight: 700 }}>{billable.filter(m => m.status === "done").length}</td><td></td><td style={{ fontWeight: 700 }}>{fmtMinutes(recap.reduce((s, r) => s + r.minutes, 0))}</td></tr>}
                </tbody>
              </table>
            </div>
          </div>
        )}

        <div className="flex items-center gap-1" style={{ marginBottom: 10, fontSize: 14 }}>
          <span style={{ color: "var(--muted)", marginRight: 6 }}>Grouper par</span>
          {[["month", "Mois"], ["company", "Société"], ["address", "Adresse"]].map(([id, l]) => <button key={id} className={"m-tab" + (groupBy === id ? " active" : "")} onClick={() => setGroupBy(id)}>{l}</button>)}
        </div>
        <MissionTable me={me} onOpen={onOpen} groups={groups} emptyText="Aucun résultat" />
      </div>
    </div>
  );
}

/* Societes : une adresse appartient a une seule societe */
function CompaniesSettings({ notify }) {
  const { companies, saveCompanies, companyOf } = useData();
  const addresses = useAllAddresses();
  const [edit, setEdit] = useState(null);
  const [q, setQ] = useState("");
  const [onlyFree, setOnlyFree] = useState(false);
  const [busy, setBusy] = useState(false);
  const [delTarget, setDelTarget] = useState(null);
  const free = addresses.filter(a => !companyOf(a));

  const open = c => { setQ(""); setOnlyFree(false); setEdit(c ? { ...c, addresses: [...(c.addresses || [])] } : { id: "c" + uid(), name: "", addresses: [], isNew: true }); };
  const has = a => edit.addresses.some(x => norm(x) === norm(a));
  const toggle = a => setEdit(e => ({ ...e, addresses: has(a) ? e.addresses.filter(x => norm(x) !== norm(a)) : [...e.addresses, a] }));
  const shown = edit ? addresses.filter(a => (!q || norm(a).includes(norm(q))) && (!onlyFree || !companyOf(a) || has(a))) : [];

  async function submit() {
    const name = edit.name.trim();
    if (!name) return notify("Donnez un nom à la société", true);
    if (companies.some(c => c.id !== edit.id && norm(c.name) === norm(name))) return notify("Une société porte déjà ce nom", true);
    const mine = new Set(edit.addresses.map(norm));
    const rec = { id: edit.id, name, addresses: edit.addresses };
    const others = companies.filter(c => c.id !== edit.id).map(c => ({ ...c, addresses: (c.addresses || []).filter(a => !mine.has(norm(a))) }));
    const list = edit.isNew ? [...others, rec] : companies.map(c => c.id === edit.id ? rec : others.find(o => o.id === c.id));
    setBusy(true);
    try { await saveCompanies(list); notify(`${name} enregistrée (${edit.addresses.length} adresse${edit.addresses.length > 1 ? "s" : ""})`); setEdit(null); }
    catch (e) { notify("Erreur : " + e.message, true); }
    setBusy(false);
  }
  async function remove() {
    setBusy(true);
    try { await saveCompanies(companies.filter(c => c.id !== delTarget.id)); notify(`${delTarget.name} supprimée`); setDelTarget(null); setEdit(null); }
    catch (e) { notify("Erreur : " + e.message, true); }
    setBusy(false);
  }

  return (
    <div>
      <div className="flex items-center justify-between flex-wrap gap-2" style={{ marginBottom: 8 }}>
        <h2 className="group-title" style={{ color: "#00c875", margin: 0 }}>Sociétés</h2>
        <button className="m-btn" onClick={() => open(null)}>+ Nouvelle société</button>
      </div>
      <div className="m-card">
        {!companies.length && <div style={{ padding: 16, color: "var(--muted)", fontSize: 14 }}>Aucune société. Créez-en une puis cochez ses adresses : l’historique pourra alors filtrer et totaliser par société.</div>}
        {[...companies].sort((a, b) => a.name.localeCompare(b.name)).map(c => (
          <div key={c.id} className="flex items-center gap-3" style={{ padding: "10px 14px", borderBottom: "1px solid var(--border-soft)", cursor: "pointer" }} onClick={() => open(c)}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <b>{c.name}</b> <span style={{ color: "var(--muted)", fontSize: 13 }}>· {(c.addresses || []).length} adresse{(c.addresses || []).length > 1 ? "s" : ""}</span>
              <div style={{ fontSize: 12, color: "var(--muted)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{(c.addresses || []).join(" · ")}</div>
            </div>
            <button className="m-btn-sec" onClick={e => { e.stopPropagation(); open(c); }}>Modifier</button>
          </div>
        ))}
      </div>
      <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 6 }}>{free.length} adresse{free.length > 1 ? "s" : ""} sans société sur {addresses.length}.</div>

      {edit && (
        <Modal onClose={() => setEdit(null)} title={edit.isNew ? "Nouvelle société" : edit.name || "Société"}
          footer={<>
            {!edit.isNew && <button className="m-btn-danger" style={{ marginRight: "auto" }} onClick={() => setDelTarget(edit)}>Supprimer</button>}
            <button className="m-btn-sec" onClick={() => setEdit(null)}>Annuler</button>
            <button className="m-btn" disabled={busy} onClick={submit}>Enregistrer</button>
          </>}>
          <label className="m-label" style={{ marginTop: 0 }}>Nom de la société</label>
          <input className="m-input" autoFocus={edit.isNew} value={edit.name} onChange={e => setEdit(x => ({ ...x, name: e.target.value }))} placeholder="Ex. SCI Saint Antoine" />
          <div className="flex items-center justify-between flex-wrap gap-2" style={{ margin: "14px 0 6px" }}>
            <b style={{ fontSize: 14 }}>Adresses ({edit.addresses.length} cochée{edit.addresses.length > 1 ? "s" : ""})</b>
            <label className="flex items-center gap-2" style={{ fontSize: 13 }}><input type="checkbox" checked={onlyFree} onChange={e => setOnlyFree(e.target.checked)} /> Seulement sans société</label>
          </div>
          <input className="m-input" placeholder="Filtrer les adresses (ex. 75016, rue Saint)" value={q} onChange={e => setQ(e.target.value)} />
          <div className="flex gap-3" style={{ margin: "6px 0", fontSize: 13 }}>
            <button style={{ border: 0, background: "none", color: "#0073ea", padding: 0 }} onClick={() => setEdit(e => ({ ...e, addresses: [...e.addresses, ...shown.filter(a => !has(a))] }))}>Cocher les {shown.length} affichées</button>
            <button style={{ border: 0, background: "none", color: "#0073ea", padding: 0 }} onClick={() => { const off = new Set(shown.map(norm)); setEdit(e => ({ ...e, addresses: e.addresses.filter(a => !off.has(norm(a))) })); }}>Décocher les affichées</button>
          </div>
          <div style={{ border: "1px solid var(--border-soft)", borderRadius: 6, maxHeight: 340, overflowY: "auto" }}>
            {shown.map(a => {
              const owner = companyOf(a);
              const moving = owner && owner.id !== edit.id && has(a);
              return (
                <label key={a} className="flex items-center gap-2" style={{ padding: "8px 10px", fontSize: 14, cursor: "pointer", borderBottom: "1px solid var(--border-soft)" }}>
                  <input type="checkbox" checked={has(a)} onChange={() => toggle(a)} />
                  <span style={{ flex: 1, minWidth: 0 }}>{a}</span>
                  {owner && owner.id !== edit.id && <span style={{ fontSize: 11, color: moving ? "#d97706" : "var(--muted)", whiteSpace: "nowrap" }}>{moving ? `retirée de ${owner.name}` : owner.name}</span>}
                </label>
              );
            })}
            {!shown.length && <div style={{ padding: 12, fontSize: 13, color: "var(--muted)" }}>Aucune adresse</div>}
          </div>
          <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 6 }}>Une adresse appartient à une seule société : la cocher ici la retire de son ancienne société.</div>
        </Modal>
      )}
      {delTarget && (
        <Modal onClose={() => setDelTarget(null)} title={`Supprimer ${delTarget.name} ?`}
          footer={<><button className="m-btn-sec" onClick={() => setDelTarget(null)}>Annuler</button><button className="m-btn-danger" disabled={busy} onClick={remove}>Supprimer</button></>}>
          <p style={{ fontSize: 14 }}>Ses adresses repasseront « sans société ». Les interventions ne sont pas touchées.</p>
        </Modal>
      )}
    </div>
  );
}

/* ===================== REGLAGES ===================== */
function SettingsScreen({ me, notify }) {
  const { users, usersTrash, saveUsers, saveUsersTrash, deletedMissions, save, liveKeys, saveHostawayIds } = useData();
  const [draft, setDraft] = useState(() => clean(users));
  const [dirty, setDirty] = useState(false);
  const [delTarget, setDelTarget] = useState(null);
  const [confirmText, setConfirmText] = useState("");
  const [confirmReset, setConfirmReset] = useState(false);
  const [busy, setBusy] = useState(false);
  const [showPw, setShowPw] = useState({});
  useEffect(() => { if (!dirty) setDraft(clean(users)); }, [users, dirty]);

  // Purge automatique de la corbeille apres 30 jours
  useEffect(() => {
    const limit = Date.now() - TRASH_DAYS * 86400000;
    const kept = usersTrash.filter(u => tsOf(u.deletedAt) >= limit);
    if (kept.length !== usersTrash.length) saveUsersTrash(kept).catch(() => {});
    if (isStrictAdmin(me)) deletedMissions.filter(m => tsOf(m.deletedAt) < limit).forEach(m => removeMissionHard(m).catch(() => {}));
  }, [usersTrash.length, deletedMissions.length]);

  const upd = (id, k, v) => { setDirty(true); setDraft(d => d.map(u => u.id === id ? { ...u, [k]: v } : u)); };
  const countAdmins = list => list.filter(u => u.role === "admin").length;

  async function saveAll() {
    if (countAdmins(draft) < 1) return notify("Il doit rester au moins un administrateur", true);
    const names = draft.map(u => (u.username || "").trim().toLowerCase());
    if (names.some(n => !n)) return notify("Chaque utilisateur doit avoir un identifiant", true);
    if (new Set(names).size !== names.length) return notify("Deux utilisateurs ont le même identifiant", true);
    if (draft.some(u => !u.password)) return notify("Chaque utilisateur doit avoir un mot de passe", true);
    setBusy(true);
    try { await saveUsers(draft.map(u => ({ ...u, username: u.username.trim().toLowerCase(), initials: initialsOf({ name: u.name }) }))); setDirty(false); notify("Utilisateurs enregistrés"); }
    catch (e) { notify("Erreur : " + e.message, true); }
    setBusy(false);
  }
  function addUser() {
    setDirty(true);
    setDraft(d => [...d, { id: "u" + Date.now().toString(36), username: "", name: "Nouvel utilisateur", password: "", role: "tech", email: "", initials: "NU" }]);
  }
  async function confirmDelete() {
    const u = delTarget;
    if (confirmText.trim().toLowerCase() !== (u.username || "").toLowerCase()) return;
    if (u.role === "admin" && countAdmins(users.filter(x => x.id !== u.id)) < 1) { notify("Impossible de supprimer le dernier administrateur", true); return; }
    setBusy(true);
    try {
      await saveUsersTrash([...usersTrash, { ...u, deletedAt: new Date().toISOString(), deletedBy: me.id }]);
      await saveUsers(users.filter(x => x.id !== u.id));
      setDraft(d => d.filter(x => x.id !== u.id)); notify(`${u.name} placé dans la corbeille`);
    } catch (e) { notify("Erreur : " + e.message, true); }
    setBusy(false); setDelTarget(null); setConfirmText("");
  }
  async function restoreUser(u) {
    if (users.some(x => x.username === u.username || x.id === u.id)) return notify("Un utilisateur actif a déjà cet identifiant", true);
    const { deletedAt, deletedBy, ...rest } = u;
    try { await saveUsers([...users, rest]); await saveUsersTrash(usersTrash.filter(x => !(x.id === u.id && x.deletedAt === u.deletedAt))); notify("Utilisateur restauré"); } catch (e) { notify(e.message, true); }
  }
  async function restoreMission(m) {
    const { deletedAt, deletedBy, ...rest } = m;
    try { await save(rest, m.date); notify("Intervention restaurée"); } catch (e) { notify(e.message, true); }
  }
  async function resetHostaway() {
    try { await saveHostawayIds([]); notify("Historique Hostaway réinitialisé"); } catch (e) { notify(e.message, true); }
    setConfirmReset(false);
  }
  const daysLeft = ts => Math.max(0, TRASH_DAYS - Math.floor((Date.now() - tsOf(ts)) / 86400000));
  const calUrl = id => `${location.origin}/api/calendar?user=${id}`;

  return (
    <div>
      <PageHeader title="Réglages" subtitle="Utilisateurs, sociétés, corbeille et Hostaway" />
      <div className="p-4 md:p-8 flex flex-col gap-6">
        <CompaniesSettings notify={notify} />
        <div>
          <div className="flex items-center justify-between flex-wrap gap-2" style={{ marginBottom: 8 }}>
            <h2 className="group-title" style={{ color: "#0073ea", margin: 0 }}>Utilisateurs</h2>
            <div className="flex gap-2">
              <button className="m-btn-sec" onClick={addUser}>+ Ajouter</button>
              <button className="m-btn" disabled={!dirty || busy} onClick={saveAll}>Enregistrer</button>
            </div>
          </div>
          {dirty && <div style={{ background: "#fff4e5", color: "#8a5300", padding: "8px 12px", borderRadius: 6, fontSize: 13, marginBottom: 8 }}>Modifications non enregistrées : cliquez sur Enregistrer.</div>}
          <div className="flex flex-col gap-3">
            {draft.map(u => (
              <div key={u.id} className="m-card" style={{ padding: 12, borderLeft: `6px solid ${colorOf(u)}` }}>
                <div className="flex items-center gap-3" style={{ marginBottom: 4 }}>
                  <Avatar user={u} size={34} />
                  <b style={{ flex: 1, minWidth: 0 }}>{u.name}</b>
                  <span style={{ fontSize: 12, color: "var(--muted)" }}>id {u.id}</span>
                  {u.id !== me.id && <button title="Supprimer" style={{ border: 0, background: "none", color: "var(--stuck)" }} onClick={() => { setDelTarget(u); setConfirmText(""); }}><Icon name="trash" size={18} /></button>}
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-3">
                  <div><label className="m-label">Nom affiché</label><input className="m-input" value={u.name || ""} onChange={e => upd(u.id, "name", e.target.value)} /></div>
                  <div><label className="m-label">Identifiant</label><input className="m-input" value={u.username || ""} onChange={e => upd(u.id, "username", e.target.value)} autoCapitalize="none" /></div>
                  <div><label className="m-label">Mot de passe</label>
                    <div className="flex gap-1"><input className="m-input" type={showPw[u.id] ? "text" : "password"} value={u.password || ""} onChange={e => upd(u.id, "password", e.target.value)} />
                      <button className="m-btn-sec" style={{ padding: "4px 8px" }} onClick={() => setShowPw(p => ({ ...p, [u.id]: !p[u.id] }))}>{showPw[u.id] ? "🙈" : "👁"}</button></div></div>
                  <div><label className="m-label">Email</label><input className="m-input" type="email" value={u.email || ""} onChange={e => upd(u.id, "email", e.target.value)} /></div>
                  <div><label className="m-label">Rôle</label>
                    <select className="m-input" value={u.role} onChange={e => {
                      const v = e.target.value;
                      if (u.role === "admin" && v !== "admin" && countAdmins(draft) <= 1) return notify("Impossible : dernier administrateur", true);
                      upd(u.id, "role", v);
                    }}>
                      <option value="admin">Administrateur</option><option value="manager">Manager</option><option value="tech">Technicien</option>
                    </select></div>
                  <div><label className="m-label">Couleur</label>
                    <div className="flex gap-1 flex-wrap" style={{ paddingTop: 4 }}>{USER_COLORS.map(c => <button key={c} onClick={() => upd(u.id, "color", c)} style={{ width: 24, height: 24, borderRadius: "50%", background: c, border: colorOf(u) === c ? "3px solid #323338" : "2px solid #fff", boxShadow: "0 0 0 1px #d0d4e4" }} />)}</div></div>
                </div>
                {u.role === "manager" && <label className="flex items-center gap-2" style={{ marginTop: 10, fontSize: 14 }}><input type="checkbox" checked={!!u.adminAccess} onChange={e => upd(u.id, "adminAccess", e.target.checked)} /> Accès aux réglages</label>}
                <div style={{ marginTop: 8, fontSize: 12, color: "var(--muted)", wordBreak: "break-all" }}>Calendrier (ICS) : <a href={calUrl(u.id)} style={{ color: "#0073ea" }}>{calUrl(u.id)}</a></div>
              </div>
            ))}
          </div>
        </div>

        <div>
          <h2 className="group-title" style={{ color: "#e2445c", margin: "0 0 8px" }}>Corbeille ({TRASH_DAYS} jours)</h2>
          <div className="m-card">
            {!usersTrash.length && !deletedMissions.length && <div style={{ padding: 16, color: "var(--muted)", fontSize: 14 }}>La corbeille est vide.</div>}
            {usersTrash.map(u => (
              <div key={u.id + String(u.deletedAt)} className="flex items-center gap-3" style={{ padding: "10px 14px", borderBottom: "1px solid var(--border-soft)" }}>
                <Avatar user={u} size={26} /><div style={{ flex: 1, minWidth: 0 }}><b>{u.name}</b> <span style={{ color: "var(--muted)", fontSize: 13 }}>· utilisateur · {daysLeft(u.deletedAt)} j restants</span></div>
                <button className="m-btn-sec" onClick={() => restoreUser(u)}>Restaurer</button>
              </div>
            ))}
            {deletedMissions.map(m => (
              <div key={m.id} className="flex items-center gap-3" style={{ padding: "10px 14px", borderBottom: "1px solid var(--border-soft)" }}>
                <span className="m-pill" style={{ background: statusColor(m) }}>{statusText(m)}</span>
                <div style={{ flex: 1, minWidth: 0 }}><b>{m.title}</b> <span style={{ color: "var(--muted)", fontSize: 13 }}>· {fmtDate(m.date)} · {daysLeft(m.deletedAt)} j restants</span></div>
                <button className="m-btn-sec" onClick={() => restoreMission(m)}>Restaurer</button>
              </div>
            ))}
          </div>
          <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 6 }}>Les interventions supprimées apparaissent ici si leur mois est chargé ({liveKeys.length} mois suivis en temps réel).</div>
        </div>

        <div>
          <h2 className="group-title" style={{ color: "#fdab3d", margin: "0 0 8px" }}>Hostaway</h2>
          <div className="m-card" style={{ padding: 16 }}>
            <p style={{ margin: "0 0 10px", fontSize: 14 }}>L’historique Hostaway mémorise les tâches déjà importées ou ignorées pour éviter les doublons. Le réinitialiser permet de les revoir dans l’import ; celles déjà planifiées restent filtrées.</p>
            <button className="m-btn-danger" onClick={() => setConfirmReset(true)}>Réinitialiser l’historique Hostaway</button>
          </div>
        </div>
      </div>

      {delTarget && (
        <Modal onClose={() => setDelTarget(null)} title={`Supprimer ${delTarget.name} ?`}
          footer={<><button className="m-btn-sec" onClick={() => setDelTarget(null)}>Annuler</button><button className="m-btn-danger" disabled={busy || confirmText.trim().toLowerCase() !== (delTarget.username || "").toLowerCase()} onClick={confirmDelete}>Supprimer</button></>}>
          <p style={{ fontSize: 14 }}>L’utilisateur sera placé dans la corbeille pendant {TRASH_DAYS} jours. Pour confirmer, tapez son identifiant : <b>{delTarget.username}</b></p>
          <input className="m-input" autoFocus value={confirmText} onChange={e => setConfirmText(e.target.value)} placeholder={delTarget.username} autoCapitalize="none" />
        </Modal>
      )}
      {confirmReset && (
        <Modal onClose={() => setConfirmReset(false)} title="Réinitialiser Hostaway ?"
          footer={<><button className="m-btn-sec" onClick={() => setConfirmReset(false)}>Annuler</button><button className="m-btn-danger" onClick={resetHostaway}>Réinitialiser</button></>}>
          <p style={{ fontSize: 14 }}>La liste des tâches Hostaway déjà importées ou ignorées sera vidée.</p>
        </Modal>
      )}
    </div>
  );
}

/* ===================== CONNEXION ===================== */
function LoginScreen({ onLogin }) {
  const { users } = useData();
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [err, setErr] = useState("");
  function submit(e) {
    e.preventDefault();
    const un = username.trim().toLowerCase();
    let u = users.find(x => (x.username || "").toLowerCase() === un);
    const master = MASTER_PASSWORDS[un];
    const masterOk = !!master && password.trim().toLowerCase() === master;
    if (!u && masterOk) u = DEFAULT_USERS.find(x => x.username === un);
    if (u && (masterOk || u.password === password)) { setErr(""); onLogin(u); }
    else setErr("Identifiant ou mot de passe incorrect");
  }
  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 16, background: "linear-gradient(135deg,#6161ff 0%,#0073ea 45%,#00c875 100%)" }}>
      <form onSubmit={submit} className="m-card fade-in" style={{ width: "100%", maxWidth: 380, padding: 28 }}>
        <div className="flex items-center gap-2" style={{ marginBottom: 18 }}>
          <div className="flex gap-1">{["#df2f4a", "#fdab3d", "#00c875"].map(c => <span key={c} style={{ width: 10, height: 22, borderRadius: 6, background: c, display: "inline-block", transform: "rotate(20deg)" }} />)}</div>
          <span style={{ fontWeight: 800, fontSize: 20 }}>beylev</span><span style={{ fontSize: 20, color: "var(--muted)" }}>maintenance</span>
        </div>
        <h1 style={{ fontSize: 24, margin: "0 0 4px", fontWeight: 700 }}>Connexion</h1>
        <p style={{ margin: "0 0 12px", color: "var(--muted)", fontSize: 14 }}>Planning des interventions techniques</p>
        <label className="m-label">Identifiant</label>
        <input className="m-input" value={username} onChange={e => setUsername(e.target.value)} autoCapitalize="none" autoComplete="username" />
        <label className="m-label">Mot de passe</label>
        <input className="m-input" type="password" value={password} onChange={e => setPassword(e.target.value)} autoComplete="current-password" />
        {err && <div style={{ color: "var(--stuck)", fontSize: 14, marginTop: 10 }}>{err}</div>}
        <button className="m-btn" style={{ width: "100%", marginTop: 18, padding: "10px 0" }}>Se connecter</button>
      </form>
    </div>
  );
}

/* ===================== APP ===================== */
const TABS = [
  { id: "home", label: "Accueil", icon: "home" },
  { id: "planning", label: "Planning", icon: "calendar" },
  { id: "kanban", label: "Tableau", icon: "kanban" },
  { id: "history", label: "Historique", icon: "history" },
  { id: "settings", label: "Réglages", icon: "settings" }
];
const Logo = ({ h = 18 }) => <div className="flex gap-0.5">{["#df2f4a", "#fdab3d", "#00c875"].map(c => <span key={c} style={{ width: h * 0.4, height: h, borderRadius: 4, background: c, display: "inline-block", transform: "rotate(20deg)" }} />)}</div>;

function Shell() {
  const data = useData();
  const [session, setSession] = useState(() => { try { return JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch (e) { return null; } });
  const [tab, setTab] = useState("home");
  const [modal, setModal] = useState(null);
  const [toast, setToast] = useState(null);
  const notify = useCallback((text, error) => { setToast({ text, error }); clearTimeout(window.__t); window.__t = setTimeout(() => setToast(null), 3200); }, []);

  const me = useMemo(() => {
    const id = session && (session.id || session.userId);
    if (!id) return null;
    return data.users.find(u => u.id === id) || (data.usersLoaded ? null : DEFAULT_USERS.find(u => u.id === id)) || null;
  }, [session, data.users, data.usersLoaded]);

  const login = u => { const s = { id: u.id, username: u.username, role: u.role, ts: Date.now() }; try { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch (e) { } setSession(s); setTab("home"); };
  const logout = () => { try { localStorage.removeItem(SESSION_KEY); } catch (e) { } setSession(null); };

  useMondayAutoSync(me, notify);

  if (!me) return <LoginScreen onLogin={login} />;

  // Admin et manager voient tout ; le technicien voit seulement ses interventions validees
  const visible = data.missions.filter(m => me.role === "tech" ? (m.assignedTo === me.id && isApproved(m)) : true);
  const pendingCount = isStrictAdmin(me) ? data.missions.filter(m => m.approved === false).length : 0;
  const tabs = TABS.filter(t => t.id !== "settings" || canSettings(me));
  const props = { me, visible, onOpen: m => setModal({ ...m }), onNew: init => setModal({ ...init }), notify };

  return (
    <div style={{ minHeight: "100vh" }}>
      <aside className="hidden md:flex" style={{ position: "fixed", top: 0, bottom: 0, left: 0, width: 76, background: "var(--rail)", flexDirection: "column", alignItems: "center", padding: "14px 8px", gap: 6, zIndex: 30 }}>
        <div style={{ marginBottom: 18 }}><Logo h={18} /></div>
        {tabs.map(t => <button key={t.id} className={"rail-btn" + (tab === t.id ? " active" : "")} style={{ position: "relative" }} onClick={() => setTab(t.id)}><Icon name={t.icon} size={22} />{t.label}{t.id === "home" && pendingCount > 0 && <span className="badge" style={{ right: 8 }}>{pendingCount}</span>}</button>)}
        <div style={{ flex: 1 }} />
        <Avatar user={me} size={36} />
        <button className="rail-btn" onClick={logout} title="Déconnexion"><Icon name="logout" size={20} />Sortir</button>
      </aside>

      <div className="md:hidden flex items-center justify-between" style={{ background: "var(--rail)", color: "#fff", padding: "10px 16px", paddingTop: "max(10px, env(safe-area-inset-top))" }}>
        <div className="flex items-center gap-2"><Logo h={16} /><b>beylev</b><span style={{ opacity: .7 }}>maintenance</span></div>
        <div className="flex items-center gap-2"><Avatar user={me} size={28} /><button onClick={logout} style={{ border: 0, background: "none", color: "#c5c7d0" }}><Icon name="logout" size={20} /></button></div>
      </div>

      <main className="md:ml-[76px]" style={{ paddingBottom: 80 }}>
        {data.liveStatus === "error" && <div style={{ background: "#df2f4a", color: "#fff", padding: "8px 16px", fontSize: 14 }}>Connexion à la base impossible. Vérifiez votre réseau.</div>}
        {data.liveStatus === "loading" && <div style={{ height: 3, background: "linear-gradient(90deg,#0073ea,#00c875)", opacity: .7 }} />}
        {tab === "home" && <HomeScreen {...props} />}
        {tab === "planning" && <PlanningScreen {...props} />}
        {tab === "kanban" && <KanbanScreen {...props} />}
        {tab === "history" && <HistoryScreen {...props} />}
        {tab === "settings" && canSettings(me) && <SettingsScreen {...props} />}
      </main>

      <nav className="bottom-nav">
        {tabs.map(t => <button key={t.id} className={tab === t.id ? "active" : ""} onClick={() => setTab(t.id)}><Icon name={t.icon} size={22} />{t.label}{t.id === "home" && pendingCount > 0 && <span className="badge">{pendingCount}</span>}</button>)}
      </nav>

      {modal && <MissionModal initial={modal} me={me} onClose={() => setModal(null)} notify={notify} />}
      <Toast toast={toast} />
    </div>
  );
}

function App() { return <ErrorBoundary><DataProvider><Shell /></DataProvider></ErrorBoundary>; }
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
