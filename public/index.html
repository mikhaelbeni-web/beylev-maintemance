/* Statuts (valeurs existantes) avec couleurs monday, toujours en style inline */
const STATUSES = [
  { id: "todo", label: "À faire", color: "#c4c4c4" },

  { id: "done", label: "Terminé", color: "#00c875" },

const GROUP_COLORS = ["#579bfc", "#a25ddc", "#00c875", "#fdab3d", "#e2445c", "#037f4c", "#ff642e", "#784bd1", "#66ccff"];
const USER_COLORS = ["#a25ddc", "#0073ea", "#00c875", "#fdab3d", "#e2445c", "#ff642e", "#037f4c", "#784bd1", "#ff158a"];
const MONTHS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
const DAYS_SHORT = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"];

/* ===================== HELPERS ===================== */
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const todayStr = () => ymd(new Date());
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const isWeekend = s => { const g = parseYmd(s).getDay(); return g === 0 || g === 6; };
const monthKeyYM = (y, m0) => `lv_missions_${y}_${pad(m0 + 1)}`;
const monthKeyOf = dateStr => `lv_missions_${dateStr.slice(0, 4)}_${dateStr.slice(5, 7)}`;
const monthLabelOfKey = k => { const [, , y, m] = k.split("_"); return `${MONTHS[Number(m) - 1]} ${y}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clean = o => JSON.parse(JSON.stringify(o));
const fmtDate = s => { if (!s) return "—"; const d = parseYmd(s); return `${pad(d.getDate())} ${MONTHS[d.getMonth()].slice(0, 4)}.`; };
const fmtDateLong = s => { if (!s) return "—"; const d = parseYmd(s); return d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" }); };
const fmtRange = m => m.dateEnd && m.dateEnd !== m.date ? `${fmtDate(m.date)} → ${fmtDate(m.dateEnd)}` : fmtDate(m.date);
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
const initialsOf = u => (u && (u.initials || String(u.name || "?").split(/\s+/).map(x => x[0]).join("").slice(0, 2))).toUpperCase();
const colorOf = u => { if (!u) return "#c4c4c4"; if (u.color) return u.color; let h = 0; for (const c of String(u.id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return USER_COLORS[h % USER_COLORS.length]; };
const iconOf = title => { const t = norm(title); const f = TYPE_ICONS.find(([k]) => t.includes(k)); return f ? f[1] : "📌"; };
const endOf = m => (m.dateEnd && m.dateEnd >= m.date ? m.dateEnd : m.date);
const coversDay = (m, d) => m.date <= d && d <= endOf(m);
const isApproved = m => m.approved !== false && m.approved !== "rejected";
const isStrictAdmin = u => u && u.role === "admin";
const canSettings = u => u && (u.role === "admin" || u.adminAccess);
const statusColor = m => (m.approved === false ? PENDING_COLOR : m.approved === "rejected" ? REJECTED_COLOR : (STATUS_BY_ID[m.status] || STATUS_BY_ID.todo).color);
const statusText = m => (m.approved === false ? "En validation" : m.approved === "rejected" ? "Refusée" : (STATUS_BY_ID[m.status] || STATUS_BY_ID.todo).label);
const tsOf = v => (typeof v === "number" ? v : new Date(v).getTime() || 0);
/* Index adresse normalisee -> societe */
const companyIndex = companies => { const idx = {}; companies.forEach(c => (c.addresses || []).forEach(a => { idx[norm(a)] = c; })); return idx; };
const monthKeysBetween = (from, to) => {
  const out = []; const d = parseYmd(from.slice(0, 7) + "-01"); const end = to.slice(0, 7);
  while (ymd(d).slice(0, 7) <= end && out.length < 120) { out.push(monthKeyYM(d.getFullYear(), d.getMonth())); d.setMonth(d.getMonth() + 1); }
  return out;
};
function downloadCsv(filename, rows) {
  const esc = v => { const t = v === null || v === undefined ? "" : String(v); return /[";\n\r]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const csv = "\ufeff" + rows.map(r => r.map(esc).join(";")).join("\r\n");
  const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function liveMonthKeys() {
  const now = new Date(); const keys = [];
  for (let i = -2; i <= 6; i++) { const d = new Date(now.getFullYear(), now.getMonth() + i, 1); keys.push(monthKeyYM(d.getFullYear(), d.getMonth())); }
  return keys;
}

/* ===================== STOCKAGE (format existant : doc { v: JSON }) ===================== */
const st = {
  ref: k => db.collection(COL).doc(k),
  parse(snap) {
    if (!snap || !snap.exists) return null;
    const d = snap.data() || {};
    if (typeof d.v === "string") { try { return JSON.parse(d.v); } catch (e) { return null; } }
    return d.v === undefined ? null : d.v;
  },
  async get(k) { return st.parse(await st.ref(k).get()); },
  set(k, v) { return st.ref(k).set({ v: JSON.stringify(v) }); }
};
/* Un doc mois = { "AAAA-MM-JJ": [missions] } */
const normMonth = raw => (!raw || typeof raw !== "object" || Array.isArray(raw)) ? {} : raw;
const flattenMonth = raw => Object.values(normMonth(raw)).flat().filter(m => m && m.id && m.date);
function withoutId(obj, id) {
  const out = {};
  Object.entries(normMonth(obj)).forEach(([d, list]) => { const l = (list || []).filter(x => x && x.id !== id); if (l.length) out[d] = l; });
  return out;
}

/* Ecrit toujours dans le doc du mois de la mission (et la retire de l ancien mois si la date a change). */
async function writeMission(mission, previousDate) {
  const m = clean(mission); delete m._mk;
  if (!m.date) throw new Error("Date manquante");
  const newKey = monthKeyOf(m.date);
  const oldKey = previousDate ? monthKeyOf(previousDate) : null;
  const newRef = st.ref(newKey);
  const oldRef = oldKey && oldKey !== newKey ? st.ref(oldKey) : null;
  await db.runTransaction(async tx => {
    const newSnap = await tx.get(newRef);
    const oldSnap = oldRef ? await tx.get(oldRef) : null;
    const obj = withoutId(st.parse(newSnap), m.id);
    obj[m.date] = [...(obj[m.date] || []), m];
    tx.set(newRef, { v: JSON.stringify(obj) });
    if (oldRef) tx.set(oldRef, { v: JSON.stringify(withoutId(st.parse(oldSnap), m.id)) });
  });
}
/* Import groupe : une transaction par mois, ignore un element Monday deja present (deux appareils en meme temps) */
async function importMissions(list) {
  const byMonth = {};
  list.forEach(m => { const k = monthKeyOf(m.date); (byMonth[k] = byMonth[k] || []).push(clean(m)); });
  let added = 0;
  for (const [k, items] of Object.entries(byMonth)) {
    const ref = st.ref(k);
    await db.runTransaction(async tx => {
      const obj = normMonth(st.parse(await tx.get(ref)));
      const known = new Set(Object.values(obj).flat().map(x => x && x.mondayId).filter(Boolean));
      let n = 0;
      items.forEach(m => { if (m.mondayId && known.has(m.mondayId)) return; (obj[m.date] = obj[m.date] || []).push(m); n++; });
      tx.set(ref, { v: JSON.stringify(obj) });
      added += n;
    });
  }
  return added;
}
async function removeMissionHard(mission) {
  const ref = st.ref(monthKeyOf(mission.date));
  await db.runTransaction(async tx => {
    const s = await tx.get(ref);
    tx.set(ref, { v: JSON.stringify(withoutId(st.parse(s), mission.id)) });
  });
}

  const list = (Array.isArray(to) ? to : [to]).filter(x => x && x.includes("@"));
  if (!list.length) return { skipped: true };
  try {
    const r = await fetch("/api/send-email", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ to: list, subject, html }) });
    return await r.json().catch(() => ({ ok: r.ok }));
  } catch (e) { console.warn("Email non envoye", e); return { error: String(e) }; }
}
function missionEmailHtml(m, intro, users) {
  const a = users.find(u => u.id === m.assignedTo);
  const c = users.find(u => u.id === m.createdBy);
  return `<div style="font-family:Arial,sans-serif;color:#323338">

    <table style="border-collapse:collapse;font-size:14px">
      <tr><td style="padding:4px 12px 4px 0;color:#676879">Intervention</td><td><b>${m.title || ""}</b></td></tr>
      <tr><td style="padding:4px 12px 4px 0;color:#676879">Lieu</td><td>${m.location || "Non précisé"}</td></tr>
      <tr><td style="padding:4px 12px 4px 0;color:#676879">Date</td><td>${fmtDateLong(m.date)}${m.dateEnd && m.dateEnd !== m.date ? " au " + fmtDateLong(m.dateEnd) : ""}${m.time ? " à " + m.time : ""}</td></tr>
      <tr><td style="padding:4px 12px 4px 0;color:#676879">Priorité</td><td>${m.priority === "urgent" ? "URGENT" : "Normale"}</td></tr>
      <tr><td style="padding:4px 12px 4px 0;color:#676879">Assigné à</td><td>${a ? a.name : "—"}</td></tr>
      <tr><td style="padding:4px 12px 4px 0;color:#676879">Créé par</td><td>${c ? c.name : "—"}</td></tr>
      <tr><td style="padding:4px 12px 4px 0;color:#676879;vertical-align:top">Description</td><td>${(m.description || "—").replace(/\n/g, "<br>")}</td></tr>
    </table>
    <p style="margin-top:16px"><a href="${location.origin}" style="background:#0073ea;color:#fff;padding:8px 16px;border-radius:4px;text-decoration:none">Ouvrir le planning</a></p>
  </div>`;
}
function compressImage(file, maxSide = 1100, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const img = new Image(); const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { error: null, info: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { this.setState({ info }); console.error(error, info); }
  render() {
    if (!this.state.error) return this.props.children;
    return (
      <div style={{ padding: 20, fontFamily: "monospace" }}>
        <div style={{ background: "#ffebee", border: "2px solid #df2f4a", borderRadius: 8, padding: 16 }}>
          <h2 style={{ color: "#df2f4a", margin: "0 0 8px", fontFamily: "Figtree" }}>Une erreur est survenue</h2>
          <pre style={{ whiteSpace: "pre-wrap", fontSize: 12 }}>{String(this.state.error && (this.state.error.stack || this.state.error))}</pre>
          {this.state.info && <pre style={{ whiteSpace: "pre-wrap", fontSize: 11, color: "#676879" }}>{this.state.info.componentStack}</pre>}
          <button className="m-btn" onClick={() => location.reload()}>Recharger</button>
        </div>
      </div>
    );
  }
}

const DataCtx = createContext(null);

function useDocValue(key, fallback) {
  const [val, setVal] = useState({ value: fallback, loaded: false, error: null });
  useEffect(() => st.ref(key).onSnapshot(s => setVal({ value: st.parse(s) ?? fallback, loaded: true, exists: s.exists, error: null }),
    e => { console.error(e); setVal(v => ({ ...v, loaded: true, error: e })); }), [key]);
  return val;
}

function useLiveMissions() {
  const [byMonth, setByMonth] = useState({});
  const [status, setStatus] = useState("loading");
  const keys = useMemo(liveMonthKeys, []);
  useEffect(() => {
    const unsubs = keys.map(k => st.ref(k).onSnapshot(s => {
      setByMonth(p => ({ ...p, [k]: flattenMonth(st.parse(s)).map(m => ({ ...m, _mk: k })) }));
      setStatus("ok");
    }, e => { console.error(e); setStatus("error"); }));
    return () => unsubs.forEach(u => u());
  }, [keys]);
  return { byMonth, status, keys };
}

function DataProvider({ children }) {
  const usersDoc = useDocValue(USERS_KEY, null);
  const trashDoc = useDocValue(USERS_TRASH_KEY, []);
  const idsDoc = useDocValue(HOSTAWAY_IDS_KEY, []);
  const notifsDoc = useDocValue(HOSTAWAY_NOTIFS_KEY, []);
  const companiesDoc = useDocValue(COMPANIES_KEY, []);
  const mondayCfgDoc = useDocValue(MONDAY_CONFIG_KEY, null);
  const mondayIdsDoc = useDocValue(MONDAY_IDS_KEY, []);
  const live = useLiveMissions();
  const [extra, setExtra] = useState({});

  // Premier lancement : cree les comptes par defaut si la base est vide
  useEffect(() => {
    if (usersDoc.loaded && !usersDoc.error && !(Array.isArray(usersDoc.value) && usersDoc.value.length)) st.set(USERS_KEY, DEFAULT_USERS).catch(() => {});
  }, [usersDoc.loaded, usersDoc.value, usersDoc.error]);

  const fetchMonths = useCallback(async keys => {
    const todo = keys.filter(k => !live.keys.includes(k));
    if (!todo.length) return;
    const res = await Promise.all(todo.map(k => st.get(k).then(v => [k, flattenMonth(v).map(m => ({ ...m, _mk: k }))]).catch(() => [k, []])));
    setExtra(p => { const n = { ...p }; res.forEach(([k, v]) => { n[k] = v; }); return n; });
  }, [live.keys]);

  const allByMonth = useMemo(() => ({ ...extra, ...live.byMonth }), [extra, live.byMonth]);
  const allMissions = useMemo(() => {
    const seen = new Set();
    return Object.values(allByMonth).flat().filter(m => (seen.has(m.id) ? false : (seen.add(m.id), true)));
  }, [allByMonth]);
  const missions = useMemo(() => allMissions.filter(m => !m.deletedAt), [allMissions]);
  const deletedMissions = useMemo(() => allMissions.filter(m => m.deletedAt), [allMissions]);

  const save = useCallback(async (m, prevDate) => {
    await writeMission(m, prevDate);
    const touched = [monthKeyOf(m.date)]; if (prevDate) touched.push(monthKeyOf(prevDate));
    await fetchMonths(touched);
  }, [fetchMonths]);

  const users = Array.isArray(usersDoc.value) && usersDoc.value.length ? usersDoc.value : DEFAULT_USERS;
  const companies = useMemo(() => (Array.isArray(companiesDoc.value) ? companiesDoc.value : []), [companiesDoc.value]);
  const companyByAddress = useMemo(() => companyIndex(companies), [companies]);
  const value = {
    companies, companyOf: loc => companyByAddress[norm(loc)] || null,
    saveCompanies: c => st.set(COMPANIES_KEY, clean(c)),
    mondayConfig: mondayCfgDoc.value, mondayLoaded: mondayCfgDoc.loaded && mondayIdsDoc.loaded,
    mondayIds: Array.isArray(mondayIdsDoc.value) ? mondayIdsDoc.value.map(String) : [],
    saveMondayConfig: c => st.set(MONDAY_CONFIG_KEY, clean(c)),
    saveMondayIds: ids => st.set(MONDAY_IDS_KEY, ids),
    importMissions: async list => { const n = await importMissions(list); await fetchMonths([...new Set(list.map(m => monthKeyOf(m.date)))]); return n; },
    users, usersLoaded: usersDoc.loaded, usersTrash: Array.isArray(trashDoc.value) ? trashDoc.value : [],
    hostawayIds: Array.isArray(idsDoc.value) ? idsDoc.value.map(String) : [],
    hostawayNotifs: Array.isArray(notifsDoc.value) ? notifsDoc.value : [],
    missions, deletedMissions, liveStatus: live.status, liveKeys: live.keys, fetchMonths, save,
    saveUsers: u => st.set(USERS_KEY, clean(u)),
    saveUsersTrash: t => st.set(USERS_TRASH_KEY, clean(t)),
    saveHostawayIds: ids => st.set(HOSTAWAY_IDS_KEY, ids),
    saveHostawayNotifs: n => st.set(HOSTAWAY_NOTIFS_KEY, clean(n))
  };
  return <DataCtx.Provider value={value}>{children}</DataCtx.Provider>;
}

function MissionModal({ initial, me, onClose, notify }) {
  const { users, save, hostawayNotifs, saveHostawayNotifs, companyOf } = useData();
  const isNew = !initial.id;
  const isTech = me.role === "tech";
  const activeUsers = users;
  const [m, setM] = useState(() => {
    const base = { status: "todo", priority: "normal", title: TASK_TYPES[0], location: BUILDINGS_LIST[0], date: todayStr(), assignedTo: (users.find(u => u.role === "tech") || users[0] || {}).id || "", photos: [], comments: [], ...initial };
    return base;
  });
  const [titleMode, setTitleMode] = useState(() => (!initial.title || TASK_TYPES.includes(initial.title) ? (initial.title || TASK_TYPES[0]) : "CUSTOM"));
  const [locMode, setLocMode] = useState(() => (!initial.location ? BUILDINGS_LIST[0] : BUILDINGS_LIST.includes(initial.location) ? initial.location : "CUSTOM"));
  const [busy, setBusy] = useState(false);
  const [comment, setComment] = useState("");
  const [confirmDel, setConfirmDel] = useState(false);
  const set = (k, v) => setM(p => ({ ...p, [k]: v }));

  const canEditContent = !isTech;
  const canValidate = isStrictAdmin(me) && m.approved === false && !isNew;
  const canDelete = isStrictAdmin(me) || (me.role === "manager" && m.approved === false && m.createdBy === me.id);
  const canChangeStatus = !isTech || m.assignedTo === me.id;

  async function persist(rec, msg) {
    await save(rec, isNew ? null : initial.date);
    if (msg) notify(msg);
  }

  async function submit() {
    if (!m.title || !m.title.trim()) return notify("Indiquez l’intervention", true);
    if (!m.location || !m.location.trim()) return notify("Indiquez le lieu", true);
    if (m.dateEnd && m.dateEnd < m.date) return notify("La date de fin est avant la date de début", true);
    setBusy(true);
    try {
      let rec = { ...m, title: m.title.trim(), location: m.location.trim(), description: (m.description || "").trim(), updatedAt: new Date().toISOString() };
      if (!rec.dateEnd || rec.dateEnd === rec.date) delete rec.dateEnd;
      if (isNew) { rec.id = uid(); rec.createdAt = new Date().toISOString(); rec.createdBy = me.id; rec.approved = isStrictAdmin(me); }
      await persist(rec);
      if (isNew && !rec.approved) {
        const admins = users.filter(u => isStrictAdmin(u) && u.email).map(u => u.email);
        sendEmail(admins, `[Beylev] Intervention à valider : ${rec.title}`, missionEmailHtml(rec, `${me.name} a soumis une intervention à valider.`, users));
        notify("Intervention soumise pour validation");
      } else if (isNew) {
        const a = users.find(u => u.id === rec.assignedTo);
        if (a && a.email && a.id !== me.id) sendEmail(a.email, `[Beylev] Nouvelle intervention : ${rec.title}`, missionEmailHtml(rec, "Une nouvelle intervention vous a été assignée.", users));
        notify("Intervention créée");
      } else notify("Modifications enregistrées");
      onClose();
    } catch (e) { console.error(e); notify("Erreur : " + e.message, true); }
    setBusy(false);
  }

  async function validate() {
    setBusy(true);
    try {
      const rec = { ...m, approved: true, approvedBy: me.id, approvedAt: new Date().toISOString() };
      await save(rec, initial.date);
      const a = users.find(u => u.id === rec.assignedTo);
      if (a && a.email) sendEmail(a.email, `[Beylev] Intervention validée : ${rec.title}`, missionEmailHtml(rec, "Votre intervention a été validée et vous est assignée.", users));
      if (rec.hostawayId) {
        sendEmail(GESTION_EMAIL, `URGENT - Bloquer la date Hostaway : ${rec.title}`, missionEmailHtml(rec, "Une intervention importée depuis Hostaway vient d’être validée. Pensez à bloquer la date sur Hostaway si nécessaire.", users));
        const n = [{ id: uid(), title: rec.title, date: rec.date, location: rec.location || "", createdAt: new Date().toISOString(), read: false }, ...hostawayNotifs].slice(0, 30);
        saveHostawayNotifs(n).catch(() => {});
      }
      notify("Intervention validée");
      onClose();
    } catch (e) { notify("Erreur : " + e.message, true); }
    setBusy(false);
  }
  async function reject() {
    setBusy(true);
    try { await save({ ...m, approved: "rejected" }, initial.date); notify("Intervention refusée"); onClose(); }
    catch (e) { notify("Erreur : " + e.message, true); }
    setBusy(false);
  }
  async function softDelete() {
    setBusy(true);
    try { await save({ ...m, deletedAt: new Date().toISOString(), deletedBy: me.id }, initial.date); notify("Intervention placée dans la corbeille (30 jours)"); onClose(); }
    catch (e) { notify("Erreur : " + e.message, true); }
    setBusy(false);
  }
  async function addPhotos(e) {
    const files = Array.from(e.target.files || []); e.target.value = "";
    let photos = [...(m.photos || [])];
    for (const f of files) {
      try {
        const data = await compressImage(f);
        const id = uid();
        await db.collection(PHOTOS).doc(id).set({ b: data });
        photos = [...photos, { id }];
      } catch (err) { notify("Photo non enregistrée : " + err.message, true); }
    }
    const rec = { ...m, photos }; setM(rec);
    if (!isNew) { try { await save(rec, initial.date); notify("Photo ajoutée"); } catch (err) { notify("Erreur : " + err.message, true); } }
  }
  async function addComment() {
    if (!comment.trim()) return;
    const c = { id: uid(), text: comment.trim(), author: me.name, authorId: me.id, createdAt: new Date().toISOString() };
    const rec = { ...m, comments: [...(m.comments || []), c] }; setM(rec); setComment("");
    if (!isNew) { try { await save(rec, initial.date); } catch (err) { notify("Erreur : " + err.message, true); } }
  }
  const statusOnly = async sid => {
    if (!canChangeStatus) return;
    const rec = { ...m, status: sid }; setM(rec);
    if (!isNew) { try { await save(rec, initial.date); notify("Statut mis à jour"); } catch (e) { notify("Erreur : " + e.message, true); } }
  };

  const footer = (
    <>
      {!isNew && canDelete && <button className="m-btn-sec" style={{ color: "var(--stuck)", marginRight: "auto" }} onClick={() => setConfirmDel(true)}>Supprimer</button>}
      <button className="m-btn-sec" onClick={onClose}>Fermer</button>
      {canValidate && <button className="m-btn-sec" disabled={busy} onClick={reject}>Refuser</button>}
      {canValidate && <button className="m-btn" style={{ background: "var(--done)" }} disabled={busy} onClick={validate}>✓ Valider</button>}
      {canEditContent && <button className="m-btn" disabled={busy} onClick={submit}>{isNew ? (isStrictAdmin(me) ? "Créer" : "Soumettre pour validation") : "Enregistrer"}</button>}
    </>
  );

  return (
    <Modal onClose={onClose} title={isNew ? "Nouvelle intervention" : (m.title || "Intervention")} footer={footer}>
      {m.approved === false && !isNew && <div style={{ background: "#f3e8fb", color: "#6c3a9c", padding: "8px 12px", borderRadius: 6, fontSize: 14, marginTop: 8 }}>⏳ En attente de validation par un administrateur</div>}
      {m.approved === "rejected" && <div style={{ background: "#eceef3", color: "#323338", padding: "8px 12px", borderRadius: 6, fontSize: 14, marginTop: 8 }}>Intervention refusée</div>}
      {m.hostawayId && <div style={{ background: "#e5f4ff", color: "#0060b9", padding: "8px 12px", borderRadius: 6, fontSize: 14, marginTop: 8 }}>Importée depuis Hostaway (tâche #{m.hostawayId})</div>}

      <label className="m-label">Statut</label>
      <div className="flex gap-2 flex-wrap">

/* ===================== IMPORT HOSTAWAY ===================== */
function matchBuilding(text) {
  const a = norm(text);
  if (!a) return null;
  for (const b of BUILDINGS_LIST) {
    if (b === "CUSTOM") continue;
    const street = norm(b.replace(/\b\d{5}\b.*$/, ""));
    if (street && a.includes(street)) return b;
  }
  return null;
}
/* Occupe = client present (arrivee <= jour < depart). Jour de depart = acces 11h-15h. */
function proposeDate(reservations, busyDates, startFrom) {
  let d = startFrom;
  for (let i = 0; i < 120; i++, d = addDays(d, 1)) {
    if (isWeekend(d) || busyDates.has(d)) continue;
    if (reservations.some(r => d >= r.start && d < r.end)) continue;
    return d;
  }
  return "";
}
const isTurnover = (reservations, d) => !!d && reservations.some(r => r.end === d);

function HostawayImport({ me, onClose, notify }) {
  const { users, missions, save, hostawayIds, saveHostawayIds, fetchMonths } = useData();
  const techs = users.filter(u => u.role === "tech");
  const [tech, setTech] = useState(techs[0] ? techs[0].id : "");
  const [state, setState] = useState({ loading: true, error: null, warnings: [], tasks: [], reservations: {} });
  const [rows, setRows] = useState([]);
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    // Charge 4 mois en plus des mois en temps reel pour connaitre les jours ou le technicien est pris
    const now = new Date(); const keys = [];
    for (let i = 0; i <= 5; i++) { const d = new Date(now.getFullYear(), now.getMonth() + i, 1); keys.push(monthKeyYM(d.getFullYear(), d.getMonth())); }
    fetchMonths(keys);
    fetch("/api/hostaway-import").then(r => r.json().then(j => ({ ok: r.ok, status: r.status, j }))).then(({ ok, status, j }) => {
      const warnings = [];
      if (j.reservationsError) warnings.push("Réservations indisponibles (" + j.reservationsError + ") : les dates proposées ne tiennent pas compte des séjours.");
      if (!ok || j.error) setState({ loading: false, error: status === 403 ? "Accès Hostaway refusé (403). Vérifiez les permissions de la clé API." : (j.error || "Erreur Hostaway"), warnings, tasks: [], reservations: {} });
      else setState({ loading: false, error: null, warnings, tasks: j.tasks || [], reservations: j.reservations || {} });
    }).catch(e => setState(s => ({ ...s, loading: false, error: String(e) })));
  }, []);

  useEffect(() => {
    if (state.loading) return;
    const known = new Set([...hostawayIds, ...missions.filter(m => m.hostawayId).map(m => String(m.hostawayId))]);
    const busyDates = new Set();
    missions.filter(m => m.assignedTo === tech && m.approved !== "rejected" && m.status !== "cancelled").forEach(m => { for (let d = m.date; d <= endOf(m); d = addDays(d, 1)) busyDates.add(d); });
    const start = todayStr();
    const out = [];
    for (const t of state.tasks) {
      if (known.has(String(t.id))) continue;
      const res = state.reservations[String(t.listingId)] || [];
      const date = proposeDate(res, busyDates, start);
      if (date) busyDates.add(date);
      const b = matchBuilding(t.listingAddress) || matchBuilding(t.listingName);
      out.push({ include: true, id: String(t.id), title: t.title || "Tâche Hostaway", description: t.description || "", location: b || "CUSTOM", custom: b ? "" : (t.listingAddress || t.listingName || ""), date, res, listingName: t.listingName });
    }
    setRows(out);
  }, [state, tech, missions.length]);

  const upd = (i, k, v) => setRows(rs => rs.map((r, j) => j === i ? { ...r, [k]: v } : r));

  async function ignore(i) {
    const r = rows[i];
    try { await saveHostawayIds([...new Set([...hostawayIds, r.id])]); setRows(rs => rs.filter((_, j) => j !== i)); notify("Tâche ignorée"); }
    catch (e) { notify(e.message, true); }
  }

  async function submit() {
    const sel = rows.filter(r => r.include);
    if (!sel.length) return;
    const bad = sel.find(r => !r.date || isWeekend(r.date));
    if (bad) return notify(`« ${bad.title} » : choisissez une date en semaine`, true);
    setBusy(true);
    try {
      for (const r of sel) {
        const turnover = isTurnover(r.res, r.date);
        const desc = turnover ? `${DEPARTURE_PREFIX}\n\n${r.description}`.trim() : r.description;
        await save({ id: uid(), date: r.date, title: r.title.trim() || "Tâche Hostaway", location: r.location === "CUSTOM" ? r.custom.trim() : r.location, description: desc,
          assignedTo: tech, status: "todo", priority: "normal", duration: 0, approved: isStrictAdmin(me), createdBy: me.id, createdAt: new Date().toISOString(), photos: [], comments: [], hostawayId: r.id }, null);
      }
      await saveHostawayIds([...new Set([...hostawayIds, ...sel.map(r => r.id)])]);
      const admins = users.filter(u => isStrictAdmin(u) && u.email).map(u => u.email);
      sendEmail(admins, `[Beylev] ${sel.length} intervention(s) Hostaway à valider`, `<p>${me.name} a soumis ${sel.length} intervention(s) importée(s) depuis Hostaway :</p><ul>${sel.map(r => `<li><b>${r.title}</b> — ${fmtDateLong(r.date)} — ${r.location === "CUSTOM" ? r.custom : r.location}</li>`).join("")}</ul><p><a href="${location.origin}">Ouvrir le planning</a></p>`);
      notify(`${sel.length} intervention(s) soumise(s) pour validation`);
      onClose();
    } catch (e) { notify("Erreur : " + e.message, true); }
    setBusy(false);
  }

  return (
    <Modal wide onClose={onClose} title="Import Hostaway"
      footer={<><button className="m-btn-sec" onClick={onClose}>Annuler</button><button className="m-btn" disabled={busy || !rows.some(r => r.include)} onClick={submit}>Soumettre {rows.filter(r => r.include).length} intervention(s)</button></>}>
      <p style={{ color: "var(--muted)", fontSize: 14 }}>Relisez et corrigez chaque ligne avant de soumettre : rien n’est créé automatiquement. La date proposée est le premier jour de semaine où l’appartement est libre et le technicien disponible.</p>
      <label className="m-label">Technicien</label>
      <select className="m-input" style={{ maxWidth: 260 }} value={tech} onChange={e => setTech(e.target.value)}>{techs.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}</select>
      {state.warnings.map((w, i) => <div key={i} style={{ background: "#fff4e5", color: "#8a5300", padding: "8px 12px", borderRadius: 6, fontSize: 13, marginTop: 8 }}>⚠️ {w}</div>)}
      {state.loading && <div style={{ padding: 24, textAlign: "center", color: "var(--muted)" }}>Chargement des tâches Hostaway…</div>}
      {state.error && <div style={{ background: "#ffebee", color: "#b00020", padding: 12, borderRadius: 6, marginTop: 12 }}>{state.error}</div>}
      {!state.loading && !state.error && !rows.length && <div style={{ padding: 24, textAlign: "center", color: "var(--muted)" }}>Aucune nouvelle tâche « pending » sur Hostaway.</div>}
      <div className="flex flex-col gap-3" style={{ marginTop: 12 }}>
        {rows.map((r, i) => {

  );
}

/* ===================== MONDAY ===================== */
const MONDAY_FIELDS = [
  { id: "title", label: "Intervention", hint: "nom de l’élément par défaut", keys: [] },
  { id: "location", label: "Adresse", keys: ["adresse", "lieu", "address", "location", "bien", "appartement", "immeuble"] },
  { id: "date", label: "Date", keys: ["date", "echeance", "jour", "timeline", "chronologie", "planning", "due"] },
  { id: "status", label: "Statut", keys: ["statut", "status", "etat"] },
  { id: "assignee", label: "Technicien", keys: ["technicien", "personne", "assigne", "responsable", "owner", "people", "intervenant"] },
  { id: "description", label: "Description", keys: ["description", "notes", "note", "detail", "commentaire", "probleme"] },
  { id: "duration", label: "Durée (minutes)", keys: ["duree", "duration", "temps", "minutes"] }
];
const NAME_COL = "__name__";
const fetchJson = url => fetch(url).then(r => r.json().then(j => { if (!r.ok) throw new Error(j.error || "HTTP " + r.status); return j; }));
function guessMapping(columns) {
  const map = { title: NAME_COL };
  MONDAY_FIELDS.forEach(f => {
    if (f.id === "title") return;
    const c = columns.find(c => f.keys.some(k => norm(c.title).includes(k)) && c.type !== "subtasks");
    if (c) map[f.id] = c.id;
  });
  return map;
}
function mondayStatus(text) {
  const t = norm(text);
  if (/termin|done|fait|fini|clos|realis/.test(t)) return "done";
  if (/cours|working|progress|demarr/.test(t)) return "inprogress";
  if (/annul|cancel/.test(t)) return "cancelled";
  return "todo";
}
/* Transforme un element Monday en intervention. Une date absente prend la date de creation de l element. */
function mondayToMission(item, map, users, defaultTech, me) {
  const val = k => (map[k] === NAME_COL ? item.name : map[k] ? (item.values[map[k]] || "") : "").trim();
  const dates = val("date").match(/\d{4}-\d{2}-\d{2}/g) || [];
  const time = (val("date").match(/\b(\d{1,2}):(\d{2})\b/) || []).slice(1);
  const created = item.createdAt ? ymd(new Date(item.createdAt)) : todayStr();
  const who = val("assignee").split(",").map(norm).filter(Boolean)[0];
  const tech = who && (users.find(u => norm(u.name) === who) || users.find(u => norm(u.name).includes(who) || who.includes(norm(u.name).split(" ")[0])));
  const loc = val("location");
  const m = {
    id: uid(), mondayId: item.id, title: val("title") || item.name || "Élément Monday",
    location: matchBuilding(loc) || loc, description: val("description"),
    date: dates[0] || created, status: mondayStatus(val("status")), assignedTo: (tech || {}).id || defaultTech,
    priority: "normal", duration: parseInt(val("duration"), 10) || 0, approved: true,
    createdBy: me.id, createdAt: new Date().toISOString(), photos: [], comments: []
  };
  if (dates[1] && dates[1] > m.date) m.dateEnd = dates[1];
  if (time.length) m.time = `${pad(time[0])}:${time[1]}`;
  return { mission: m, noDate: !dates.length, noTech: !tech };
}

/* Synchro Monday -> app : les nouveaux elements du tableau sont importes a l ouverture puis toutes les 10 minutes */
function useMondayAutoSync(me, notify) {
  const { mondayConfig, mondayLoaded, mondayIds, saveMondayIds, missions, users, importMissions } = useData();
  const latest = useRef({}); latest.current = { mondayIds, missions, users };
  const running = useRef(false);
  const enabled = !!(me && me.role !== "tech" && mondayLoaded && mondayConfig && mondayConfig.auto && mondayConfig.boardId);
  useEffect(() => {
    if (!enabled) return;
    const run = async () => {
      if (running.current) return; running.current = true;
      try {
        const { items } = await fetchJson(`/api/monday?action=items&board=${mondayConfig.boardId}`);
        const { mondayIds, missions, users } = latest.current;
        const known = new Set([...mondayIds, ...missions.map(m => m.mondayId).filter(Boolean)]);
        const fresh = items.filter(it => !known.has(it.id));
        if (!fresh.length) return;
        const list = fresh.map(it => mondayToMission(it, mondayConfig.map || {}, users, mondayConfig.defaultTech, me).mission);
        const n = await importMissions(list);
        await saveMondayIds([...new Set([...mondayIds, ...fresh.map(it => it.id)])]);
        if (n) notify(`${n} élément${n > 1 ? "s" : ""} Monday importé${n > 1 ? "s" : ""}`);
      } catch (e) { console.warn("Synchro Monday", e); }
      finally { running.current = false; }
    };
    run();
    const t = setInterval(run, 10 * 60000);
    return () => clearInterval(t);
  }, [enabled, JSON.stringify(mondayConfig)]);
}

function MondayImport({ me, onClose, notify }) {
  const { users, missions, mondayConfig, mondayIds, saveMondayConfig, saveMondayIds, importMissions } = useData();
  const techs = users.filter(u => u.role === "tech");
  const cfg = mondayConfig || {};
  const [boards, setBoards] = useState(null);
  const [boardId, setBoardId] = useState(cfg.boardId || "");
  const [data, setData] = useState(null);
  const [map, setMap] = useState(cfg.map || null);
  const [defaultTech, setDefaultTech] = useState(cfg.defaultTech || (techs[0] || users[0] || {}).id);
  const [auto, setAuto] = useState(cfg.auto !== false);
  const [hideDone, setHideDone] = useState(false);
  const [excluded, setExcluded] = useState({});
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(() => { fetchJson("/api/monday?action=boards").then(j => setBoards(j.boards)).catch(e => setError(e.message)); }, []);
  useEffect(() => {
    if (!boardId) return;
    setData(null); setError("");
    fetchJson(`/api/monday?action=items&board=${boardId}`).then(j => {
      setData(j);
      if (!map || boardId !== cfg.boardId) setMap(guessMapping(j.board.columns));
    }).catch(e => setError(e.message));
  }, [boardId]);

  const known = new Set([...mondayIds, ...missions.map(m => m.mondayId).filter(Boolean)]);
  const rows = data && map ? data.items.filter(it => !known.has(it.id)).map(it => ({ item: it, ...mondayToMission(it, map, users, defaultTech, me) })) : [];
  const shown = rows.filter(r => !hideDone || r.mission.status !== "done");
  const selected = shown.filter(r => !excluded[r.item.id]);
  const already = data ? data.items.length - rows.length : 0;

  async function submit() {
    setBusy(true);
    try {
      const n = selected.length ? await importMissions(selected.map(r => r.mission)) : 0;
      // Les elements decoches ou masques sont marques ignores : la synchro auto ne les reprendra pas
      await saveMondayIds([...new Set([...mondayIds, ...rows.map(r => r.item.id)])]);
      await saveMondayConfig({ boardId, boardName: data.board.name, map, defaultTech, auto, updatedAt: new Date().toISOString(), updatedBy: me.id });
      notify(n ? `${n} intervention${n > 1 ? "s" : ""} importée${n > 1 ? "s" : ""} depuis Monday` : "Réglages Monday enregistrés");
      onClose();
    } catch (e) { notify("Erreur : " + e.message, true); }
    setBusy(false);
  }
  const colOptions = data ? data.board.columns.filter(c => c.id !== "name") : [];
  const userName = id => (users.find(u => u.id === id) || {}).name || "—";

  return (
    <Modal wide onClose={onClose} title="Import Monday"
      footer={<>
        <button className="m-btn-sec" onClick={onClose}>Annuler</button>
        <button className="m-btn" disabled={busy || !data || !map} onClick={submit}>{selected.length ? `Importer ${selected.length} intervention${selected.length > 1 ? "s" : ""}` : "Enregistrer les réglages"}</button>
      </>}>
      <p style={{ color: "var(--muted)", fontSize: 14, marginTop: 0 }}>L’app lit votre tableau Monday sans jamais le modifier. Choisissez le tableau, vérifiez quelle colonne correspond à quoi, puis importez. Un élément déjà importé ne revient jamais.</p>
      {error && <div style={{ background: "#ffebee", color: "#b00020", padding: 12, borderRadius: 6, marginBottom: 12, fontSize: 14 }}>{error}{/MONDAY_API_TOKEN/.test(error) && <div style={{ marginTop: 4 }}>Ajoutez le jeton Monday dans Vercel (Settings &gt; Environment Variables) puis redéployez.</div>}</div>}
      <label className="m-label" style={{ marginTop: 0 }}>Tableau Monday</label>
      <select className="m-input" value={boardId} onChange={e => { setBoardId(e.target.value); setExcluded({}); }}>
        <option value="">{boards ? "Choisir un tableau…" : "Chargement des tableaux…"}</option>
        {(boards || []).map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
        {!boards && cfg.boardId && <option value={cfg.boardId}>{cfg.boardName || cfg.boardId}</option>}
      </select>

      {boardId && !data && !error && <div style={{ padding: 20, textAlign: "center", color: "var(--muted)" }}>Lecture du tableau…</div>}
      {data && map && (<>
        <div style={{ fontWeight: 600, margin: "16px 0 4px" }}>Correspondance des colonnes</div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-3">
          {MONDAY_FIELDS.map(f => (
            <div key={f.id}>
              <label className="m-label">{f.label}</label>
              <select className="m-input" value={map[f.id] || ""} onChange={e => setMap(m => ({ ...m, [f.id]: e.target.value }))}>
                <option value="">— Aucune —</option>
                <option value={NAME_COL}>Nom de l’élément</option>
                {colOptions.map(c => <option key={c.id} value={c.id}>{c.title}</option>)}
              </select>
            </div>
          ))}
          <div>
            <label className="m-label">Technicien si non reconnu</label>
            <select className="m-input" value={defaultTech} onChange={e => setDefaultTech(e.target.value)}>{users.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}</select>
          </div>
        </div>
        <label className="flex items-start gap-2" style={{ marginTop: 14, fontSize: 14, background: "#e5f4ff", padding: 10, borderRadius: 6 }}>
          <input type="checkbox" checked={auto} onChange={e => setAuto(e.target.checked)} style={{ marginTop: 3 }} />
          <span><b>Importer automatiquement les nouveaux éléments</b><br /><span style={{ color: "var(--muted)" }}>Chaque élément créé ensuite dans ce tableau arrive tout seul dans l’app (vérification à l’ouverture puis toutes les 10 minutes). Décochez quand l’équipe n’utilise plus Monday.</span></span>
        </label>

        <div className="flex items-center justify-between flex-wrap gap-2" style={{ margin: "16px 0 6px" }}>
          <b>{rows.length} nouvel{rows.length > 1 ? "s" : ""} élément{rows.length > 1 ? "s" : ""}{already ? <span style={{ fontWeight: 400, color: "var(--muted)" }}> · {already} déjà importé{already > 1 ? "s" : ""} ou ignoré{already > 1 ? "s" : ""}</span> : null}</b>
          <div className="flex items-center gap-3" style={{ fontSize: 13 }}>
            <label className="flex items-center gap-1"><input type="checkbox" checked={hideDone} onChange={e => setHideDone(e.target.checked)} /> Masquer les terminés</label>
            <button style={{ border: 0, background: "none", color: "#0073ea", padding: 0 }} onClick={() => setExcluded(Object.fromEntries(shown.map(r => [r.item.id, !selected.length ? false : true])))}>{selected.length ? "Tout décocher" : "Tout cocher"}</button>
          </div>
        </div>
        <div style={{ border: "1px solid var(--border-soft)", borderRadius: 6, maxHeight: 360, overflowY: "auto" }}>
          {shown.map(r => {
            const m = r.mission; const off = !!excluded[r.item.id];
            return (
              <label key={r.item.id} className="flex items-start gap-2" style={{ padding: "8px 10px", fontSize: 13, cursor: "pointer", borderBottom: "1px solid var(--border-soft)", opacity: off ? 0.5 : 1 }}>
                <input type="checkbox" checked={!off} onChange={() => setExcluded(x => ({ ...x, [r.item.id]: !off }))} style={{ marginTop: 3 }} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div className="flex items-center gap-2 flex-wrap"><b style={{ fontSize: 14 }}>{m.title}</b><span className="m-pill" style={{ background: statusColor(m) }}>{statusText(m)}</span></div>
                  <div style={{ color: "var(--muted)" }}>
                    <span style={{ color: r.noDate ? "#d97706" : "inherit" }}>{fmtRange(m)}{r.noDate ? " (date de création)" : ""}</span>{m.time ? ` · ${m.time}` : ""} · {m.location || <span style={{ color: "#d97706" }}>sans adresse</span>} · <span style={{ color: r.noTech ? "#d97706" : "inherit" }}>{userName(m.assignedTo)}</span>
                  </div>
                </div>
              </label>
            );
          })}
          {!shown.length && <div style={{ padding: 16, textAlign: "center", color: "var(--muted)", fontSize: 14 }}>Rien de nouveau dans ce tableau.</div>}
        </div>
        <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 6 }}>En orange : valeur devinée (date de création, technicien par défaut) ou manquante. Les éléments décochés ou masqués seront ignorés définitivement. Les interventions importées sont déjà validées et restent modifiables dans l’app.</div>
      </>)}
    </Modal>
  );
}

function PlanningScreen({ me, visible, onOpen, onNew }) {
  const { fetchMonths } = useData();
  const [view, setView] = useState("month");
  const [cursor, setCursor] = useState(() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; });
  const [selDay, setSelDay] = useState(null);
  useEffect(() => {
    if (view === "month") { const p = new Date(cursor.y, cursor.m - 1, 1); fetchMonths([monthKeyYM(cursor.y, cursor.m), monthKeyYM(p.getFullYear(), p.getMonth())]); }
    else fetchMonths(Array.from({ length: 12 }, (_, i) => monthKeyYM(cursor.y, i)));
  }, [view, cursor.y, cursor.m, fetchMonths]);

  const shown = visible.filter(m => m.approved !== "rejected");
  const byDate = useMemo(() => {
    const o = {};
    shown.forEach(m => { const e = endOf(m); let d = m.date; for (let i = 0; d <= e && i < 62; i++, d = addDays(d, 1)) (o[d] = o[d] || []).push(m); });
    Object.values(o).forEach(l => l.sort((a, b) => (a.time || "").localeCompare(b.time || "")));
    return o;
  }, [shown]);
  const move = n => setCursor(c => view === "month" ? { y: c.m + n < 0 ? c.y - 1 : c.m + n > 11 ? c.y + 1 : c.y, m: (c.m + n + 12) % 12 } : { y: c.y + n, m: c.m });

  const first = new Date(cursor.y, cursor.m, 1);
  const offset = (first.getDay() + 6) % 7;
  const daysIn = new Date(cursor.y, cursor.m + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < offset; i++) cells.push(null);
  for (let d = 1; d <= daysIn; d++) cells.push(`${cursor.y}-${pad(cursor.m + 1)}-${pad(d)}`);
  while (cells.length % 7) cells.push(null);
  const today = todayStr();

  return (
    <div>
      <PageHeader title="Planning" subtitle="Calendrier des interventions"
        actions={me.role !== "tech" && <button className="m-btn" onClick={() => onNew({ date: selDay || today })}><span className="inline-flex items-center gap-1"><Icon name="plus" size={16} /> Nouvelle intervention</span></button>}
        tabs={<><button className={"m-tab" + (view === "month" ? " active" : "")} onClick={() => setView("month")}>Mois</button><button className={"m-tab" + (view === "year" ? " active" : "")} onClick={() => setView("year")}>Année</button></>} />
      <div className="p-4 md:p-8">
        <div className="flex items-center gap-2" style={{ marginBottom: 12 }}>
          <button className="m-btn-sec" style={{ padding: "6px 8px" }} onClick={() => move(-1)}><Icon name="left" size={18} /></button>
          <button className="m-btn-sec" onClick={() => { const d = new Date(); setCursor({ y: d.getFullYear(), m: d.getMonth() }); }}>Aujourd’hui</button>
          <button className="m-btn-sec" style={{ padding: "6px 8px" }} onClick={() => move(1)}><Icon name="right" size={18} /></button>
          <h2 style={{ margin: "0 0 0 8px", fontSize: 20, fontWeight: 600, textTransform: "capitalize" }}>{view === "month" ? `${MONTHS[cursor.m]} ${cursor.y}` : cursor.y}</h2>
        </div>

        {view === "month" ? (
          <div className="m-card" style={{ overflow: "hidden" }}>
            <div className="grid grid-cols-7" style={{ background: "#fff", borderBottom: "1px solid var(--border-soft)" }}>
              {DAYS_SHORT.map(d => <div key={d} style={{ padding: "8px 4px", fontSize: 12, color: "var(--muted)", textAlign: "center", fontWeight: 500 }}>{d}</div>)}
            </div>
            <div className="grid grid-cols-7">
              {cells.map((d, i) => {
                if (!d) return <div key={i} className="cal-cell" style={{ background: "#fafbfc", cursor: "default" }} />;
                const list = byDate[d] || [];
                const we = isWeekend(d);
                return (
                  <div key={d} className="cal-cell" style={{ background: d === selDay ? "#e5f4ff" : we ? "#fafbfc" : "#fff" }} onClick={() => setSelDay(d)}>
                    <div style={{ fontSize: 12, fontWeight: d === today ? 700 : 500, color: d === today ? "#fff" : "var(--muted)", background: d === today ? "#0073ea" : "transparent", borderRadius: 11, width: 22, height: 22, display: "flex", alignItems: "center", justifyContent: "center" }}>{Number(d.slice(8))}</div>
                    {list.slice(0, 3).map(m => <span key={m.id} className="cal-chip" style={{ background: statusColor(m) }} title={(m.time ? m.time + " " : "") + m.title + (m.location ? " — " + m.location : "")} onClick={e => { e.stopPropagation(); onOpen(m); }}>{m.title}</span>)}
                    {list.length > 3 && <span style={{ fontSize: 11, color: "var(--muted)" }}>+{list.length - 3}</span>}
                  </div>
                );
              })}
            </div>
          </div>
        ) : (
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            {MONTHS.map((name, mi) => {
              const f = new Date(cursor.y, mi, 1); const off = (f.getDay() + 6) % 7; const n = new Date(cursor.y, mi + 1, 0).getDate();
              const cnt = shown.filter(m => m.date.slice(0, 7) === `${cursor.y}-${pad(mi + 1)}`).length;
              return (
                <div key={mi} className="m-card" style={{ padding: 12, cursor: "pointer" }} onClick={() => { setCursor({ y: cursor.y, m: mi }); setView("month"); }}>
                  <div className="flex justify-between" style={{ marginBottom: 6 }}><b style={{ textTransform: "capitalize" }}>{name}</b><span style={{ fontSize: 12, color: "var(--muted)" }}>{cnt} intervention{cnt > 1 ? "s" : ""}</span></div>
                  <div className="grid grid-cols-7 gap-0.5">
                    {Array.from({ length: off }).map((_, k) => <div key={"o" + k} />)}
                    {Array.from({ length: n }, (_, k) => {
                      const ds = `${cursor.y}-${pad(mi + 1)}-${pad(k + 1)}`; const l = byDate[ds] || [];
                      const bg = l.length ? (l.every(x => x.status === "done") ? "#00c875" : l.some(x => x.approved === false) ? PENDING_COLOR : l.some(x => x.status === "inprogress") ? "#fdab3d" : "#579bfc") : (ds === today ? "#cce5ff" : "#f5f6f8");
                      return <div key={k} title={`${ds} : ${l.length}`} style={{ height: 18, borderRadius: 3, background: bg, fontSize: 9, color: l.length ? "#fff" : "#9699a6", display: "flex", alignItems: "center", justifyContent: "center" }}>{k + 1}</div>;
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {view === "month" && selDay && (
          <div style={{ marginTop: 20 }}>
            <MissionTable me={me} onOpen={onOpen} emptyText={`Aucune intervention le ${fmtDateLong(selDay)}`}
              groups={[{ key: "day", title: fmtDateLong(selDay), color: "#0073ea", items: byDate[selDay] || [], showEmpty: true }]} />
          </div>
        )}
      </div>
    </div>
  );
}

function KanbanScreen({ me, visible, onOpen }) {
  const { users, save, fetchMonths } = useData();
  const [dragId, setDragId] = useState(null);
  const [over, setOver] = useState(null);
  const now = new Date();
  const start = ymd(new Date(now.getFullYear(), now.getMonth(), 1));
  const end = ymd(new Date(now.getFullYear(), now.getMonth() + 6, 0));
  useEffect(() => { const k = []; for (let i = 0; i < 6; i++) { const d = new Date(now.getFullYear(), now.getMonth() + i, 1); k.push(monthKeyYM(d.getFullYear(), d.getMonth())); } fetchMonths(k); }, []);
  // 6 mois (mois courant + 5) et interventions encore ouvertes des mois precedents
  const items = visible.filter(m => m.approved !== "rejected" && ((m.date >= start && m.date <= end) || (m.status !== "done" && m.status !== "cancelled" && m.date < start)));
  const canDrag = m => isApproved(m) && (me.role !== "tech" || m.assignedTo === me.id);
  const drop = async sid => {
    const m = items.find(x => x.id === dragId); setOver(null); setDragId(null);
    if (!m || (m.status || "todo") === sid || !canDrag(m)) return;
    try { await save({ ...m, status: sid }, m.date); } catch (e) { alert(e.message); }
  };
  return (
    <div>
      <PageHeader title="Tableau" subtitle="Glissez-déposez les cartes pour changer leur statut · 6 mois" />
      <div className="p-4 md:p-8">
        <div className="flex gap-4" style={{ overflowX: "auto", paddingBottom: 12 }}>
          {STATUSES.map(s => {
            const list = items.filter(m => (m.status || "todo") === s.id).sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")));
            return (
              <div key={s.id} className="kan-col" style={{ outline: over === s.id ? `2px dashed ${s.color}` : "none" }}
                onDragOver={e => { e.preventDefault(); setOver(s.id); }} onDragLeave={() => setOver(o => o === s.id ? null : o)} onDrop={e => { e.preventDefault(); drop(s.id); }}>
                <div style={{ background: s.color, color: "#fff", borderRadius: "8px 8px 0 0", padding: "10px 12px", fontWeight: 600, display: "flex", justifyContent: "space-between" }}>
                  <span>{s.label}</span><span style={{ opacity: .85 }}>{list.length}</span>
                </div>
                <div style={{ overflowY: "auto", paddingTop: 8, flex: 1, minHeight: 80 }}>
                  {list.map(m => {
                    const a = users.find(u => u.id === m.assignedTo);
                    const late = s.id !== "done" && s.id !== "cancelled" && endOf(m) < todayStr();
                    return (
                      <div key={m.id} className="kan-card" draggable={canDrag(m)} onDragStart={e => { setDragId(m.id); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", m.id); }} onDragEnd={() => { setDragId(null); setOver(null); }}
                        onClick={() => onOpen(m)} style={{ opacity: dragId === m.id ? 0.5 : 1, borderLeft: `4px solid ${statusColor(m)}` }}>
                        <div style={{ fontWeight: 600, fontSize: 14, marginBottom: 4 }}>{iconOf(m.title)} {m.title}</div>
                        <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 6 }}>{m.location || "—"}</div>
                        <div className="flex items-center justify-between gap-1">
                          <span style={{ fontSize: 12, fontWeight: 500, color: late ? "#df2f4a" : "var(--text)" }}>📅 {fmtRange(m)}{m.time ? " " + m.time : ""}</span>
                          <div className="flex items-center gap-1">
                            {m.priority === "urgent" && <Pill color="#e2445c">Urgent</Pill>}
                            {m.approved === false && <Pill color={PENDING_COLOR}>Validation</Pill>}
                            <Avatar user={a} size={24} />
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}
