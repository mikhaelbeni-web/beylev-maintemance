<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maintenance Beylev</title>
<meta name="theme-color" content="#292f4c">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.22.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.22.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.22.2/firebase-auth-compat.js"></script>
<style>
  /* Palette inspiree de monday.com */
  :root{
    --bg:#f6f7fb; --surface:#ffffff; --surface-2:#f5f6f8; --border:#d0d4e4; --border-soft:#e6e9ef;
    --text:#323338; --muted:#676879; --primary:#0073ea; --primary-hover:#0060b9;
    --rail:#292f4c; --rail-text:#c5c7d0; --done:#00c875; --stuck:#df2f4a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Figtree,Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{overflow-x:hidden}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
  .m-btn{background:var(--primary);color:#fff;border:0;border-radius:4px;padding:8px 16px;font-weight:500;font-size:14px;line-height:20px;transition:background .15s}
  .m-btn:hover{background:var(--primary-hover)}
  .m-btn:disabled{opacity:.5;cursor:not-allowed}
  .m-btn-sec{background:transparent;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:7px 15px;font-weight:500;font-size:14px}
  .m-btn-sec:hover{background:var(--surface-2)}
  .m-btn-danger{background:var(--stuck);color:#fff;border:0;border-radius:4px;padding:8px 16px;font-weight:500;font-size:14px}
  .m-btn-danger:disabled{opacity:.5;cursor:not-allowed}
  .m-input{width:100%;border:1px solid var(--border);border-radius:4px;padding:8px 10px;background:#fff;outline:none}
  .m-input:focus{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
  .m-input:disabled{background:var(--surface-2)}
  .m-label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:500}
  .m-card{background:var(--surface);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--border-soft)}
  /* Tableau facon monday */
  .m-table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;min-width:720px}
  .m-table th{font-weight:500;color:var(--muted);font-size:13px;background:#fff;border-bottom:1px solid var(--border-soft);border-right:1px solid var(--border-soft);padding:8px;text-align:center;white-space:nowrap}
  .m-table th:first-child{text-align:left}
  .m-table td{background:#fff;border-bottom:1px solid var(--border-soft);border-right:1px solid var(--border-soft);padding:0;height:38px;text-align:center;white-space:nowrap}
  .m-table tr:hover td{background:#f5f6f8}
  .m-table td.m-name{text-align:left;padding:0 10px;max-width:280px;overflow:hidden;text-overflow:ellipsis}
  .m-cell-status{display:flex;align-items:center;justify-content:center;height:100%;min-height:38px;color:#fff;font-weight:500;font-size:13px;padding:0 8px;position:relative}
  .m-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .m-pill{display:inline-flex;align-items:center;gap:4px;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap}
  .m-avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:600;flex-shrink:0;border:2px solid #fff}
  .m-tab{padding:8px 4px;margin-right:18px;font-size:14px;color:var(--muted);border:0;background:none;border-bottom:2px solid transparent;font-weight:500}
  .m-tab.active{color:var(--text);border-bottom-color:var(--primary)}
  .rail-btn{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;padding:10px 0;border:0;background:transparent;color:var(--rail-text);font-size:11px;border-radius:8px}
  .rail-btn.active{background:rgba(255,255,255,.12);color:#fff}
  .rail-btn:hover{color:#fff}
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border-soft);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:40}
  @media(min-width:768px){.bottom-nav{display:none}}
  .bottom-nav button{flex:1;border:0;background:none;padding:8px 0 6px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:500;position:relative}
  .bottom-nav button.active{color:var(--primary)}
  .badge{position:absolute;top:2px;right:calc(50% - 20px);background:#df2f4a;color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700}
  .modal-back{position:fixed;inset:0;background:rgba(41,47,76,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:768px){.modal-back{align-items:center}}
  .modal{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:12px 12px 0 0;box-shadow:0 15px 50px rgba(0,0,0,.3)}
  @media(min-width:768px){.modal{border-radius:12px}}
  .kan-col{background:var(--surface-2);border-radius:8px;min-width:260px;width:260px;flex-shrink:0;display:flex;flex-direction:column;max-height:calc(100vh - 220px)}
  .kan-card{background:#fff;border-radius:6px;padding:10px 12px;margin:0 8px 8px;box-shadow:0 1px 2px rgba(0,0,0,.08);cursor:grab;border:1px solid var(--border-soft)}
  .kan-card:active{cursor:grabbing}
  .cal-cell{min-height:92px;border-right:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);padding:4px;background:#fff;overflow:hidden;cursor:pointer;min-width:0}
  @media(max-width:640px){.cal-cell{min-height:64px;padding:2px}}
  .cal-chip{display:block;font-size:11px;line-height:15px;color:#fff;border-radius:3px;padding:1px 4px;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500}
  .battery{display:flex;height:22px;border-radius:4px;overflow:hidden;background:#c4c4c4}
  .group-title{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;padding:6px 0;background:none;border:0;text-align:left}
  .fade-in{animation:fi .15s ease-out}
  @keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="root"></div>

<script src="app.js"></script>
</body>
</html>
